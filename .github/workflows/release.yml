name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  explorer:
    uses: ./.github/workflows/explorer-checks.yml

  release:
    needs: explorer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag and package versions
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/check-release-version.js "$version"

      # This job has a fresh runner; reusable Explorer checks do not share
      # node_modules. Server unit tests import the locked Explorer runtime.
      - name: Install Explorer dependencies
        run: npm ci --prefix explorer --no-audit --no-fund

      - name: Run unit tests
        run: node --test tests/unit/*.test.js

      - name: Build and smoke-test release bundle
        shell: bash
        run: bash tests/release-smoke.sh "${GITHUB_REF_NAME#v}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          notes=(--generate-notes)
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes_file" ]; then notes=(--notes-file "$notes_file"); fi
          gh release create "$GITHUB_REF_NAME" \
            dist/release/session-cartographer-*.tar.gz \
            dist/release/session-cartographer-*.sha256 \
            --verify-tag \
            "${notes[@]}" \
            "${prerelease[@]}"
