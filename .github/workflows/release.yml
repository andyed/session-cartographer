name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag and package versions
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_version=$(node -p "require('./package.json').version")
          test "$version" = "$package_version"

      - name: Run unit tests
        run: node --test tests/unit/*.test.js

      - name: Build and smoke-test release bundle
        shell: bash
        run: bash tests/release-smoke.sh "${GITHUB_REF_NAME#v}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          notes=(--generate-notes)
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes_file" ]; then notes=(--notes-file "$notes_file"); fi
          gh release create "$GITHUB_REF_NAME" \
            dist/release/session-cartographer-*.tar.gz \
            dist/release/session-cartographer-*.sha256 \
            --verify-tag \
            "${notes[@]}" \
            "${prerelease[@]}"
