name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run unit tests
        run: node --test tests/unit/*.test.js

      - name: Verify repository marketplace install
        shell: bash
        run: bash tests/source-marketplace-smoke.sh
